# Deploy the Scrabble Bingo Trainer (a static PWA) to GitHub Pages.
# Enable once under Settings -> Pages -> Source: "GitHub Actions".
# Publishes the scrabble-bingo-trainer/ folder as the site root.
name: Deploy bingo trainer to Pages

on:
  push:
    branches: [main, master]
    paths:
      - "scrabble-bingo-trainer/**"
      - ".github/workflows/bingo-trainer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scrabble-bingo-trainer
      - id: deployment
        uses: actions/deploy-pages@v4
