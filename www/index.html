<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ahh-toys</title>
  <link rel="icon" href="./bingo/icon.svg">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f1ea; color: #23201a;
    }
    @media (prefers-color-scheme: dark) { body { background: #17150f; color: #ece7db; } }
    main { width: min(560px, 90vw); padding: 32px 4px; }
    h1 { font: 700 22px/1 "Georgia", serif; margin: 0 0 4px; }
    p.sub { color: #7c766a; margin: 0 0 28px; }
    .toys { display: grid; gap: 12px; }
    a.toy {
      display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
      padding: 16px; border: 1px solid #e2ddd0; border-radius: 14px; background: #fffdf7;
      transition: transform .06s;
    }
    @media (prefers-color-scheme: dark) { a.toy { background: #211e17; border-color: #332f24; } }
    a.toy:active { transform: scale(.99); }
    a.toy img { width: 52px; height: 52px; border-radius: 12px; }
    a.toy b { display: block; font-size: 17px; }
    a.toy span { color: #7c766a; font-size: 13.5px; }
    footer { margin-top: 28px; color: #7c766a; font-size: 12.5px; }
    footer a { color: #2f7d4f; }
  </style>
</head>
<body>
  <main>
    <h1>ahh-toys</h1>
    <p class="sub">Various toys, tricks, and demos.</p>

    <div class="toys">
      <a class="toy" href="./bingo/">
        <img src="./bingo/icon.svg" alt="">
        <span>
          <b>Scrabble Bingo Trainer &rarr;</b>
          <span>Drill 7- &amp; 8-letter bingos. Drag tiles, works offline, add to home screen.</span>
        </span>
      </a>

      <a class="toy" href="./hourglass/">
        <img src="./hourglass/icon.svg" alt="">
        <span>
          <b>Hourglass &rarr;</b>
          <span>A flowing sand timer of any length. No numbers, just sand.</span>
        </span>
      </a>
    </div>

    <footer>Source: <a href="https://github.com/ahh/ahh-toys">github.com/ahh/ahh-toys</a></footer>
  </main>
</body>
</html>
